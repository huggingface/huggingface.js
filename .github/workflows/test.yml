name: Test
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # needed to mint the OIDC token exchanged for a short-lived HF token (trusted publishers)
      contents: read

    steps:
      - uses: actions/checkout@v3
        with:
          # Could use something like rmacklin/fetch-through-merge-base@v0 instead when the repo gets bigger
          fetch-depth: 0
      - name: "Extracting the merge base into 'SINCE'"
        id: since
        env:
          PR_REF: ${{  github.event.pull_request.head.ref }}
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          if [ -z $PR_REF ]
          then
            echo "SINCE=${{ github.sha }}^1" >> $GITHUB_OUTPUT
          else
            echo "SINCE=$(git merge-base $BASE_REF ${{ github.sha }})" >> $GITHUB_OUTPUT
          fi

      - run: npm install -g corepack@latest && corepack enable

      - uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"
      - run: |
          pnpm install --frozen-lockfile --filter .
          pnpm install --frozen-lockfile --filter ...[${{ steps.since.outputs.SINCE }}]...
          pnpm --filter ...[${{ steps.since.outputs.SINCE }}]... build

      - name: Install the hf CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Exchange OIDC token for a short-lived HF token (trusted publisher)
        env:
          HF_OIDC_RESOURCE: coyotte508 # HF username whose user-publisher is configured under https://huggingface.co/settings/authentication#ci-cd-access
        run: |
          # Validate the token shape before writing it to GITHUB_ENV: a single-line "hf_..." value
          # cannot smuggle extra KEY=VALUE lines into the env file, whatever the CLI outputs.
          token="$(hf auth token)" || { echo "::warning::OIDC token exchange failed, tests will run unauthenticated"; exit 0; }
          if ! [[ "$token" =~ ^hf_[A-Za-z0-9._-]+$ ]]; then
            echo "::warning::Unexpected token format from OIDC exchange, ignoring it"
            exit 0
          fi
          echo "HF_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Test
        run: pnpm --filter ...[${{ steps.since.outputs.SINCE }}] test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # needed to mint the OIDC token exchanged for a short-lived HF token (trusted publishers)
      contents: read

    steps:
      - uses: actions/checkout@v3
        with:
          # Could use something like rmacklin/fetch-through-merge-base@v0 instead when the repo gets bigger
          fetch-depth: 0
      - name: "Extracting the merge base into 'SINCE'"
        id: since
        env:
          PR_REF: ${{  github.event.pull_request.head.ref }}
        run: |
          if [ -z $PR_REF ]
          then
            echo "SINCE=${{ github.sha }}^1" >> $GITHUB_OUTPUT
          else
            echo "SINCE=$(git merge-base origin/${{ github.event.pull_request.base.ref }} ${{ github.sha }})" >> $GITHUB_OUTPUT
          fi

      - run: google-chrome --version

      - run: npm install -g corepack@latest && corepack enable

      - uses: actions/setup-node@v3
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"
      - run: |
          pnpm install --frozen-lockfile --filter .
          pnpm install --frozen-lockfile --filter ...[${{ steps.since.outputs.SINCE }}]...
          pnpm --filter ...[${{ steps.since.outputs.SINCE }}]... build

      - name: Install the hf CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Exchange OIDC token for a short-lived HF token (trusted publisher)
        env:
          HF_OIDC_RESOURCE: coyotte508 # HF username whose user-publisher is configured under https://huggingface.co/settings/authentication#ci-cd-access
        run: |
          # Validate the token shape before writing it to GITHUB_ENV: a single-line "hf_..." value
          # cannot smuggle extra KEY=VALUE lines into the env file, whatever the CLI outputs.
          token="$(hf auth token)" || { echo "::warning::OIDC token exchange failed, tests will run unauthenticated"; exit 0; }
          if ! [[ "$token" =~ ^hf_[A-Za-z0-9._-]+$ ]]; then
            echo "::warning::Unexpected token format from OIDC exchange, ignoring it"
            exit 0
          fi
          echo "HF_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Test in browser
        run: pnpm --filter ...[${{ steps.since.outputs.SINCE }}] test:browser

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # needed to mint the OIDC token exchanged for a short-lived HF token (trusted publishers)
      contents: read

    steps:
      - uses: actions/checkout@v3

      - run: npm install -g corepack@latest && corepack enable

      - uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Install the hf CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Exchange OIDC token for a short-lived HF token (trusted publisher)
        env:
          HF_OIDC_RESOURCE: coyotte508 # HF username whose user-publisher is configured under https://huggingface.co/settings/authentication#ci-cd-access
        run: |
          # Validate the token shape before writing it to GITHUB_ENV: a single-line "hf_..." value
          # cannot smuggle extra KEY=VALUE lines into the env file, whatever the CLI outputs.
          token="$(hf auth token)" || { echo "::warning::OIDC token exchange failed, tests will run unauthenticated"; exit 0; }
          if ! [[ "$token" =~ ^hf_[A-Za-z0-9._-]+$ ]]; then
            echo "::warning::Unexpected token format from OIDC exchange, ignoring it"
            exit 0
          fi
          echo "HF_TOKEN=$token" >> "$GITHUB_ENV"

      - name: E2E - start mock npm registry
        run: |
          npm i -g verdaccio verdaccio-memory verdaccio-auth-memory
          echo >> .npmrc
          echo "//localhost:4874/:_authToken=1FlYaQkIdHsIztXCHmqu9g==" >> .npmrc
          npx verdaccio --listen 4874 --config e2e/mock-registry-config.yaml &

      - name: E2E test - publish packages to mock repo
        working-directory: e2e
        run: |
          sleep 3
          pnpm i --filter root --filter inference... --filter hub... --filter blake3-jit... --filter xetchunk-wasm... --filter tasks-gen --frozen-lockfile
          pnpm --filter blake3-jit --filter gearhash-jit --filter xetchunk-wasm --filter inference --filter hub --filter tasks --filter jinja publish --force --no-git-checks --registry http://localhost:4874/

      - name: E2E test - test yarn install
        working-directory: e2e/ts
        run: |
          npm i -g yarn --force
          # yarn now looks at root package.json for the package manager...
          mv ../../package.json ../../package.json.bk
          yarn install --registry http://localhost:4874/
          mv ../../package.json.bk ../../package.json

      - name: E2E test - typescript node project
        working-directory: e2e/ts
        run: |
          pnpm i --ignore-workspace --registry http://localhost:4874/
          pnpm start
        env:
          token: $HF_TOKEN

      - name: E2E test - svelte app build
        working-directory: e2e/svelte
        run: |
          pnpm i --ignore-workspace --registry http://localhost:4874/
          pnpm build
          pnpm run test:browser

      - uses: denoland/setup-deno@v1
        with:
          deno-version: vx.x.x
      - name: E2E test - deno import from npm
        working-directory: e2e/deno
        run: deno run --allow-read --allow-net --allow-env=HF_TOKEN index.ts
        env:
          NPM_CONFIG_REGISTRY: http://localhost:4874/
